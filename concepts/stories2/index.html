#fab{position:fixed;right:max(12px,calc(50% - 228px));bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:3px solid #000;background:var(--c,#fff);color:#000;z-index:55;cursor:pointer;box-shadow:0 8px 24px #000a;display:flex;align-items:center;justify-content:center;padding:0}

#mp.on{transform:none;visibility:visible}

</style></head><body>

<script>
var D={"hu": {"t": {"art": "ART", "software": "SOFTWARE", "music": "MUSIC", "animation": "ANIMATION", "sub_art": "110 festmény", "sub_software": "Space Cat Delay · Berlin School · Reverb", "sub_music": "Számok · mixek · podcast", "sub_animation": "Zenei videók, animátorként", "bio": "BIO", "gallery": "GALÉRIA", "delay": "DELAY", "disco": "DISZKOGRÁFIA", "id": "ID", "videos": "MUSIC VIDEOS", "discogs_full": "Teljes lista a Discogson →", "open_yt": "Megnyitás a YouTube-on", "back": "← MUSIC", "exh_title": "KIÁLLÍTÁSOK", "delay_tag": "Atmospheric Echo Machine", "delay_btn": "LETÖLTÉS: HAMAROSAN", "delay_fmt": "VST3 · AU · macOS"}, "art_bio": ["Shane 54 igazi sokoldalú ember.", "A popénekesi múltja és a 90-es évek slágerei miatt, amiket a mai napig mindenhol játszanak, nyugodtan állíthatjuk, hogy ő Magyarország egyik legismertebb képzőművésze. (Oké, elsősorban a zenéjéről ismert, de azért az utcán a mai napig felismerik, ami a festők többségénél ritkább dolog.)", "A legelső képalkotó MI-rendszerek megjelenésével 2022-ben belecsöppent ebbe a technológiába és a végtelen lehetőségeibe. Amit technikában nélkülözött, azt a látásmódjával pótolta.", "Furcsa módon addig soha semmi köze nem volt a művészethez, különösebben nem is érdekelte. De az MI-képek készítése valahogy megnyitott benne valamit, ami messzebbre vitte, mint bárki – ő maga is – gondolta volna.", "2022 végén két macska „festmény”-renderje, amint egy szintipop zenekart alakítanak, egyik napról a másikra mindent megváltoztatott. Amikor kitette az Instagramra, berobbant: ez jelezte, hogy a macskaművészet olyan út, amit érdemes bejárni.", "Amikor „festményszerű tárgyait” – a nyomatokat átfestette, hogy egyediek legyenek – bemutatta a művészeti közösségnek egy hatalmas budapesti művészeti vásáron, gyorsan megváltozott a megítélés. Azok a macskák egyértelműen slágerek lettek, a következő lépés pedig az volt, hogy hagyományos módon is megfesse őket. Ecsetet és vásznat fogott, rengeteg festés-oktatóvideót nézett meg a YouTube-on (ma is nézi), és soha nem nézett vissza. A víziója megmutatta, merre tart: csak azt kellett kitalálnia, hogyan vigye vászonra az ötleteit. Elég sajátos munkamódszer, de valahogy működött. A közönség sokkal jobban szerette a kézzel festett műveit, mint az MI-„festményeket”, pedig azok is úgy fogytak, mint a cukor.", "Egy évvel később, 2025-ben megrendezte első önálló kiállítását Magyarország egyik legnagyobb galéria- és aukciósházában. A hely teljesen megtelt rajongókkal, akik láthatóan élvezték a Shane által teremtett színes macskavilágot.", "Azóta a híres macskafestmények mellett egy nagy magyar divatmárkával működött együtt, így a macskái az ország összes üzletébe eljutottak. Az elmúlt hónapokban Lóránt Ervin „Hervé” szobrászbarátjával dolgozik: több projekten is azon vannak, hogy a művészetét lehozzák a falról, és valódi terekbe vigyék."], "plugins_bio": "Karakteres effektek és hangszerek, amiket elsősorban magamnak építek. A Space Cat Delay a Korg Monotron Delay önoszcilláló, zajos világából indult: nem tiszta delay, hanem hangulatgyár. A Berlin School és a Space Cat Reverb készülőben van.", "music_bio": ["1973-ban született Budapesten. Még gimnazista volt, amikor popzenekarának első albuma megjelent, így húsz éves kora előtt már ismert közszereplő lett. A fiúegyüttes, amelynek frontembere volt, félmillió lemezt adott el, és néhány korai dala beépült a magyar popkultúrába.", "A 90-es évek után elindult a DJ-karrierje, ami hihetetlen magasságokba repítette: ő az egyetlen magyar előadó, akinek RIAA aranylemeze van az Egyesült Államokban, és az egyetlen, aki valaha az első helyre került a Billboard Dance listán Magyarországról. A Myon & Shane 54 DJ/producer duó egyik feleként három éven át egymás után szerepelt a világ legjobb 100 DJ-je között a zeneipar bibliájának számító brit Mixmag listáján.", "Zenei producerként és remixerként dolgozott többek között Lana Del Reyjel, Jessie J-vel, Tiëstóval, Armin van Buurennel, az Above & Beyonddal és még sok más előadóval."], "anim_bio": "Animátorként zenei videókat is készítek: ezek közül válogatás.", "id_bio": "Az International Departures a podcastom volt. Évekkel ezelőtt véget ért, az archívumot később újra elérhetővé teszem itt."}, "en": {"t": {"art": "ART", "software": "SOFTWARE", "music": "MUSIC", "animation": "ANIMATION", "sub_art": "110 paintings", "sub_software": "Space Cat Delay · Berlin School · Reverb", "sub_music": "Tracks · mixes · podcast", "sub_animation": "Music videos, as an animator", "bio": "BIO", "gallery": "GALLERY", "delay": "DELAY", "disco": "DISCOGRAPHY", "id": "ID", "videos": "MUSIC VIDEOS", "discogs_full": "Full list on Discogs →", "open_yt": "Open on YouTube", "back": "← MUSIC", "exh_title": "EXHIBITIONS", "delay_tag": "Atmospheric Echo Machine", "delay_btn": "DOWNLOAD: COMING SOON", "delay_fmt": "VST3 · AU · macOS"}, "art_bio": ["Shane 54 is truly a man of many trades.", "Because of his pop singer background, and 90s mega hit singles getting played everywhere to this very day we can safely say he is one of the most well known fine artists of Hungary. (Ok, he’s known mainly for his musical output, but hey, people still recognise him on the street which is a less common feat with most painters)", "With the arrival of the very early image creating AI systems, in 2022 he found himself immersed into this technology and its endless possibilities. What he was lacking in technique, he made up with a vision.", "Oddly enough, up to that point he never had anything to do with art, he wasn’t particularly interested in it. But somehow creating AI images opened up something, that took him way further than anyone - including himself - would have thought.", "Late 2022 a “painting” render of two cats posing as a synth pop band changed everything overnight. When he posted it on his instagram, it blew up, suggesting cat art is an avenue worth discovering.", "As his “painting looking objects” - he painted over the prints to make them unique - were introduced to the art community at a huge art fair in Budapest, perception changed up real fast. Those cats were clearly a hit, and the next step was to make them the traditional way. He grabbed brushes and canvases, watched TONS of painting tutorials on Youtube (he still does) and he never looked back. His vision made sure he knows where he’s headed: he only needed to know how to put the ideas on canvas, a rather peculiar way of working, but somehow it did work. The public loved his handmade art much more than his AI “paintings”, even though those were selling like hotcakes.", "A year later he had his first solo exhibition at one of the biggest gallery/auction houses in Hungary in 2025. The place was completely filled with fans who clearly enjoyed the world Shane created with his colorful cats.", "Since then besides those famous cat paintings, he collaborated with a large Hungarian fashion brand to bring his cats into their stores all over the country. The past few months spent collaborating with Ervin “Hervé” Lóránt, a sculptor friend: they are working on several projects to take his art off the wall and bring it into real spaces."], "plugins_bio": "Characterful effects and instruments, built first of all for myself. Space Cat Delay grew out of the self-oscillating, noisy world of the Korg Monotron Delay: not a clean delay but an atmosphere machine. Berlin School and Space Cat Reverb are on the way.", "music_bio": ["Born in Budapest Hungary in 1973, he was still in high school when his pop band’s first album was released - he was a well known public figure before turning 20. The boyband he fronted sold half a million records, and some of those early songs cemented themselves into Hungarian pop culture.", "After the 90s, he began his dj career, which took him to unbelievable heights: he’s the only Hungarian artist with an RIAA certified Gold Record in the USA, also he’s the only one to ever topped the Billboard Dance Charts from his native country. For 3 years in a row as one half dj/producer duo Myon & Shane 54 he was named in the Top 100 international djs of the world, by music industry bible Mixmag UK.", "As a music producer / remixer he worked with the likes of Lana Del Rey, Jessie J, Tiesto, Armin Van Buuren, Above & Beyond and many many more."], "anim_bio": "As an animator I also make music videos. A selection of them below.", "id_bio": "International Departures was my podcast. It ended years ago; I will make the archive available here again."}, "paintings": [["p06", "Wood-collage cat", 1.34], ["p03", "Black cat, red ears", 0.745], ["p01", "Upside-down cat", 0.693], ["p07", "Cat eyes", 1.145], ["p02", "Grey tabby", 1.745], ["p04", "Two happy cats", 1.203], ["p05", "Two cats, sunglasses", 1.412], ["p08", "Two cats at the bar", 1.395], ["p09", "Blue geometric cat", 1.309], ["p10", "Fat blue striped cat", 1.333]], "exh": [["2023", {"hu": "március", "en": "March"}, "Art & Antique Fair, Budapest, Hungary"], ["2023", {"hu": "szeptember", "en": "September"}, "Jókai 7, Mindszentkalla, Hungary"], ["2023", {"hu": "november", "en": "November"}, "Fashion Street, Budapest"], ["2024", {"hu": "március", "en": "March"}, "Art & Antique Fair, Budapest, Hungary"], ["2024", {"hu": "június", "en": "June"}, "Fishing On Orfű, Orfű, Hungary"], ["2024", {"hu": "július", "en": "July"}, "Füred Art Week, Balatonfüred, Hungary"], ["2024", {"hu": "augusztus", "en": "August"}, "STRAND Festival, Zamárdi, Hungary"], ["2025", {"hu": "március", "en": "March"}, "Art & Antique Fair, Budapest, Hungary"], ["2025", {"hu": "június", "en": "June"}, "Solo Exhibition – Bodo Gallery, Budapest, Hungary"], ["2025", {"hu": "július", "en": "July"}, "Füred Art Week, Balatonfüred, Hungary"], ["2025", {"hu": "december", "en": "December"}, "Szentendre Art Week, Szentendre, Hungary"], ["2026", {"hu": "február", "en": "February"}, "Art & Antique Fair, Budapest, Hungary"]], "videos": [["RMMwct1Lm44", "Panic Attack", "Shane 54 x Alex Sonata & TheRio"], ["LJda5fIwFnw", "Personal Jesus", "Cubicor
