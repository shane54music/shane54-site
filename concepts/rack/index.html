<!doctype html><html lang="hu"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Space Cat Rack · Shane 54</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&family=Inter:wght@500;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#0b0f1a;color:#dfe8ff;font-family:Inter,sans-serif}
body{background:radial-gradient(ellipse at 50% -10%,#1d2a52,#0b0f1a 60%);padding-bottom:40px}
.rack{max-width:560px;margin:0 auto;padding:12px}
.chas{border:6px solid #1c2333;border-radius:22px;background:#12182a;overflow:hidden;box-shadow:0 30px 60px -20px #000}
.strip{display:flex;height:10px}.strip i{flex:1}
.head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.head b{font:900 18px Orbitron;letter-spacing:.08em}.head b em{font-style:normal;color:#ffb347}
.led{display:flex;gap:6px}.led i{width:10px;height:10px;border-radius:50%;background:#253052}.led i.on{background:#7cff6b;box-shadow:0 0 10px #7cff6b}
.sel{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:8px 16px 16px;align-items:center}
.knob{width:150px;height:150px;position:relative;touch-action:none;user-select:none}
.knob svg{width:100%;height:100%}
#cap{transform-origin:75px 75px;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.mods{display:grid;gap:8px}
.mods button{display:flex;align-items:center;gap:10px;border:2px solid #263154;background:#0e1424;color:#9fb0d9;border-radius:12px;padding:0 12px;min-height:44px;font:700 13px Orbitron;letter-spacing:.06em;cursor:pointer;text-align:left}
.mods button i{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px #0e1424,0 0 0 4px var(--c)}
.mods button.on{background:var(--c);color:#0b0f1a;border-color:var(--c)}.mods button.on i{background:#0b0f1a;box-shadow:none}
.screen{margin:0 12px 14px;border:3px solid #263154;border-radius:14px;background:#06090f;min-height:420px;position:relative;overflow:hidden}
.screen:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px);pointer-events:none}
.mh{display:flex;justify-content:space-between;padding:10px 14px;font:900 13px Orbitron;letter-spacing:.1em;background:var(--c);color:#0b0f1a}
.mb{padding:14px;font:400 15px/1.6 'Share Tech Mono';color:#cfe3ff;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.mb h2{margin:0 0 8px;font:900 26px Orbitron;color:var(--c)}
.mb img.f{display:block;width:100%;border-radius:10px;border:2px solid #263154;margin:10px 0}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.g3 img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:2px solid #263154}
.row{display:flex;gap:10px;padding:10px 0;border-top:1px dashed #263154}.row b{color:var(--c);width:44px;flex:none}.row small{margin-left:auto;opacity:.6;text-align:right}
.btn{display:inline-flex;align-items:center;min-height:46px;padding:0 18px;border-radius:999px;background:var(--c);color:#0b0f1a;font:900 13px Orbitron;letter-spacing:.06em;text-decoration:none;margin-top:8px}
.wave{display:flex;align-items:flex-end;gap:3px;height:56px;margin:8px 0}.wave i{flex:1;background:var(--c);opacity:.85;animation:w 1.1s infinite alternate ease-in-out}
@keyframes w{from{transform:scaleY(.2)}to{transform:scaleY(1)}}.wave i{transform-origin:bottom}
.foot{display:flex;justify-content:space-between;padding:6px 16px 14px;font:400 11px 'Share Tech Mono';color:#6b7aa6}
input{width:100%;min-height:48px;background:#0b0f1a;color:#fff;border:2px solid var(--c);border-radius:10px;padding:0 12px;font:16px 'Share Tech Mono'}
</style></head><body>
<div class="rack"><div class="chas">
<div class="strip"><i style="background:#ff9f43"></i><i style="background:#35e0ff"></i><i style="background:#7cff6b"></i><i style="background:#ff6ec7"></i></div>
<div class="head"><b>SHANE <em>54</em>'s RACK</b><div class="led" id="led"></div></div>
<div class="sel">
 <div class="knob" id="knob"><svg viewBox="0 0 150 150">
  <g id="ticks"></g>
  <circle cx="75" cy="75" r="44" fill="#0b0f1a" stroke="#263154" stroke-width="4"/>
  <g id="cap"><circle cx="75" cy="75" r="38" fill="#1b2442" stroke="#3a4a80" stroke-width="3"/><rect x="72" y="42" width="6" height="22" rx="3" fill="#ffb347"/></g></svg></div>
 <div class="mods" id="mods"></div>
</div>
<div class="screen" id="scr"></div>
<div class="foot"><span>PRESET: <b id="pn">—</b></span><span>shane54.com</span></div>
</div></div>
<script>
var I='../../assets/img/';
var M=[
{k:'ART',c:'#ff9f43',t:'110 festmény',b:function(){return '<h2>ART</h2>Shane 54 igazi sokoldalú ember.<div class="g3" style="margin:12px 0">'+['p03','p04','p05','p07','p09','p10'].map(function(p){return '<img src="'+I+p+'.jpg">'}).join('')+'</div><a class="btn" href="../../hu/art/">GALÉRIA →</a>'}},
{k:'SOFTWARE',c:'#35e0ff',t:'Space Cat Delay',b:function(){return '<h2>SOFTWARE</h2>Space Cat Delay · Berlin School · Reverb<img class="f" src="'+I+'delay_ui.jpg"><div class="wave">'+Array(28).join('<i></i>').split('<i></i>').map(function(_,i){return '<i style="animation-delay:'+(i*.07)+'s;animation-duration:'+(.6+i%5*.2)+'s"></i>'}).join('')+'</div><a class="btn" href="../../hu/software/">LETÖLTÉS →</a>'}},
{k:'MUSIC',c:'#7cff6b',t:'Számok · mixek · podcast',b:function(){return '<h2>MUSIC</h2>1973, Budapest. RIAA aranylemez, Billboard Dance #1, háromszor Mixmag Top 100 (Myon & Shane 54).<img class="f" src="'+I+'dj.jpg">'+[['2024','Heist Film / Klondyke'],['2022','Kingdom'],['2017','Return To Love'],['2016','Round We Go'],['2013','Strangers']].map(function(r){return '<div class="row"><b>'+r[0]+'</b>'+r[1]+'</div>'}).join('')+'<a class="btn" href="../../hu/music/#disco">DISZKOGRÁFIA →</a> <a class="btn" href="../../hu/music/id/">▶ PODCAST</a>'}},
{k:'ANIMATION',c:'#ff6ec7',t:'Zenei videók',b:function(){return '<h2>ANIMATION</h2>Zenei videók, animátorként.<img class="f" src="'+I+'p08.jpg"><a class="btn" href="../../hu/animation/">VIDEÓK →</a>'}},
{k:'JOIN THE CLUB',c:'#c9b6ff',t:'Hírlevél',b:function(){return '<h2>JOIN<br>THE CLUB</h2>Új zene, videók, pluginek és koncertek elsőként.<br><br><input placeholder="e-mail címed"><br><a class="btn" href="#">FELIRATKOZOM</a>'}}];
var cur=-1,ang=[-120,-60,0,60,120],step=function(){return 240/(M.length-1)};
function pos(i){return -120+i*step()}
function sel(i){cur=i;var m=M[i];document.documentElement.style.setProperty('--c',m.c);
 document.getElementById('cap').style.transform='rotate('+pos(i)+'deg)';
 document.getElementById('scr').innerHTML='<div class="mh"><span>'+m.k+'</span><span>'+String(i+1).padStart(2,'0')+'/0'+M.length+'</span></div><div class="mb">'+m.b()+'</div>';
 [].forEach.call(document.querySelectorAll('.mods button'),function(b,j){b.className=j==i?'on':''});
 [].forEach.call(document.querySelectorAll('#led i'),function(b,j){b.className=j==i?'on':''});
 document.getElementById('pn').textContent=m.t}
document.getElementById('mods').innerHTML=M.map(function(m,i){return '<button style="--c:'+m.c+'" onclick="sel('+i+')"><i></i>'+m.k+'</button>'}).join('');
document.getElementById('led').innerHTML=M.map(function(){return '<i></i>'}).join('');
var t='';for(var i=0;i<M.length;i++){var a=(pos(i)-90)*Math.PI/180;t+='<circle cx="'+(75+Math.cos(a)*62)+'" cy="'+(75+Math.sin(a)*62)+'" r="5" fill="'+M[i].c+'"/>'}document.getElementById('ticks').innerHTML=t;
var kn=document.getElementById('knob'),dr=0;
function fromEv(e){var r=kn.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,a=Math.atan2(dx,-dy)*180/Math.PI;a=Math.max(-120,Math.min(120,a));return Math.round((a+120)/step())}
kn.addEventListener('pointerdown',function(e){dr=1;kn.setPointerCapture(e.pointerId);sel(fromEv(e))});
kn.addEventListener('pointermove',function(e){if(dr){var i=fromEv(e);if(i!=cur)sel(i)}});kn.addEventListener('pointerup',function(){dr=0});
sel(2);
</script></body></html>
