<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--a:#c8ff00}
html,body{margin:0;background:#f2f0ea;color:#0a0a0a;font-family:'Space Mono',monospace}
.tick{position:sticky;top:0;z-index:30;background:var(--a);border-bottom:3px solid #0a0a0a;overflow:hidden;white-space:nowrap;font:700 12px/30px 'Space Mono';text-transform:uppercase}

.row{border-top:3px solid #0a0a0a;position:relative;overflow:hidden;cursor:pointer}

.row .bgi{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .25s;mix-blend-mode:multiply}
.row:hover .bgi,.row.o .bgi{opacity:.55}
.row.o{background:var(--a)}
.pan{max-height:0;overflow:hidden;transition:max-height .5s}.row.o .pan{max-height:1400px}
.pan>div{padding:8px 14px 22px;position:relative;z-index:2;font-size:13px;line-height:1.55}
.hs{display:flex;gap:10px;overflow-x:auto;margin:6px -14px 12px;padding:0 14px;scroll-snap-type:x mandatory}.hs img{height:220px;width:auto;border:3px solid #0a0a0a;scroll-snap-align:start;flex:none}
.tb{display:grid;grid-template-columns:48px 1fr auto;border-top:1px solid #0a0a0a;padding:8px 0;gap:8px}.tb b{font-weight:700}
.lnk{display:inline-block;margin:10px 8px 0 0;background:#0a0a0a;color:var(--a);padding:12px 16px;font:700 13px 'Space Mono';text-decoration:none;border:3px solid #0a0a0a}
.lnk.w{background:#fff;color:#0a0a0a}
.sig{padding:30px 14px 14px;border-top:3px solid #0a0a0a;font:400 clamp(40px,14vw,90px)/.9 'Archivo Black';letter-spacing:-.04em;text-transform:uppercase;background:#0a0a0a;color:var(--a)}
.sig input{display:block;width:100%;margin:18px 0 10px;border:3px solid var(--a);background:transparent;color:#fff;padding:14px;font:16px 'Space Mono'}
.sig button{border:0;background:var(--a);color:#0a0a0a;padding:14px 20px;font:700 13px 'Space Mono'}
.sig p{font:400 12px/1.5 'Space Mono';text-transform:none;letter-spacing:0;color:#fff;max-width:40ch}
footer{background:#0a0a0a;color:#888;padding:10px 14px 24px;font-size:11px;display:flex;justify-content:space-between}
